# 星渊战线 · Astra Frontline —— 生产站点配置
#
# 使用说明：
# 1. 把下面的 server_name / ssl_certificate 路径换成你自己的域名与证书路径
#    （不要把真实公网 IP 提交进仓库）。
# 2. 本文件应被 nginx.conf 的 http 上下文 include（conf.d / sites-enabled）。
# 3. 需要 gzip_static（nginx 官方发行版默认内置）；若安装了 ngx_brotli，
#    取消 brotli_static 注释即可直接使用构建产物中的 .br/.gz 预压缩文件。

# API 请求级限流：足够轮询型客户端（对局/聊天 2s 轮询）使用，
# 同时压制注册、匹配等接口的滥用。
limit_req_zone $binary_remote_addr zone=astra_api_limit:10m rate=30r/s;

# ====== HTTP -> HTTPS 跳转 ======
server {
    listen 80;
    listen [::]:80;
    server_name aixt.website www.aixt.website;  # TODO: 替换为实际域名

    location = /robots.txt {
        root /var/www/astra-frontline;
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aixt.website www.aixt.website;  # TODO: 替换为实际域名

    # ====== SSL 证书（TODO: 替换为实际证书路径）======
    ssl_certificate     /etc/nginx/ssl/aixt.website/aixt.website_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/aixt.website/aixt.website.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # ====== 安全头（共享 include，见文件内说明）======
    include /etc/nginx/astra-frontline/nginx-security-headers.conf;

    root /var/www/astra-frontline;
    index index.html;

    # ====== 传输压缩 ======
    # 优先使用构建产物中的 .gz/.br 预压缩文件（vite-plugin-compression2 生成），
    # 避免运行时压缩大文件的 CPU 开销。
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml
        font/ttf
        font/otf
        font/woff
        font/woff2;
    gzip_static on;
    # brotli_static on;  # 需 ngx_brotli 模块

    # ====== Online APIs (Docker 只发布到 127.0.0.1) ======
    location ^~ /api/cloud/ {
        limit_req zone=astra_api_limit burst=60 nodelay;
        proxy_pass http://127.0.0.1:3210/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location ^~ /api/platform/ {
        limit_req zone=astra_api_limit burst=60 nodelay;
        proxy_pass http://127.0.0.1:3211/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location ^~ /api/match/ {
        limit_req zone=astra_api_limit burst=60 nodelay;
        proxy_pass http://127.0.0.1:3212/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location ^~ /api/social/ {
        limit_req zone=astra_api_limit burst=60 nodelay;
        proxy_pass http://127.0.0.1:3213/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # ====== 游戏静态资源（图片/音频/视频/字体全部位于 /assets/ 下）======
    # 必须 ^~ 前缀匹配：普通前缀 location 会被下面的正则 location 遮蔽，
    # 导致 1 年 immutable 缓存策略失效退化为 7 天。
    location ^~ /assets/ {
        include /etc/nginx/astra-frontline/nginx-security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # ====== SPA 入口 (任何路由回退到 index.html) ======
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ====== index.html 不缓存（带自身 add_header，需重新 include 安全头）======
    location = /index.html {
        include /etc/nginx/astra-frontline/nginx-security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires 0;
    }

    # ====== robots.txt（带自身 add_header，需重新 include 安全头）======
    location = /robots.txt {
        include /etc/nginx/astra-frontline/nginx-security-headers.conf;
        access_log off;
        log_not_found off;
    }

    # ====== 安全: 隐藏敏感文件 ======
    location ~ /\.(?!well-known) {
        deny all;
    }

    # ====== 日志 ======
    access_log /var/log/nginx/astra-frontline.access.log;
    error_log  /var/log/nginx/astra-frontline.error.log;
}
