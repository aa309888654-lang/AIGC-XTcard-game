# 共享安全响应头（被 astra-frontline.nginx.conf 各处 include）。
#
# 重要：nginx 的 add_header 不跨层级继承——任何一个 location 里只要
# 出现了自己的 add_header（例如设置 Cache-Control），它就不再继承
# server 级的任何响应头。因此所有带自定义 add_header 的 location
# 必须重新 include 本文件，否则会丢失 CSP/HSTS 等全部安全头。
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self'; connect-src 'self'; frame-ancestors 'none'; form-action 'self'" always;
