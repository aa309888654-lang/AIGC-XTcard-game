# ⚠️ 可选模块，默认【不要启用】：本文件引用的 asset-auth:8080 鉴权服务
# 尚未实现（docker-compose.platform.yml 中没有该服务），直接 include 会导致
# 所有 /assets/ 请求 502。此外其 "private, no-store" 缓存策略与主配置的
# "1 年 immutable" 互相矛盾，且 120r/m 限流会与前端并发预加载冲突。
# 若未来要做资产防盗链：先实现 asset-auth 服务，再替换主配置中的
# location ^~ /assets/ 段，并同步调整前端预加载并发度。
#
# Include this from the HTTPS server block that serves the production build.
# The /_asset_auth subrequest MUST validate the authenticated session and a
# short-lived asset signature. It must reject missing, expired, or replayed tokens.
limit_req_zone $cookie_astra_session zone=asset_by_session:20m rate=120r/m;

location = /_asset_auth {
    internal;
    proxy_pass http://asset-auth:8080/authorize-asset;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-Method $request_method;
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header X-Original-Host $host;
    proxy_set_header X-Original-Referer $http_referer;
    proxy_set_header Cookie $http_cookie;
}

location ^~ /assets/ {
    auth_request /_asset_auth;
    limit_req zone=asset_by_session burst=40 nodelay;
    limit_except GET HEAD { deny all; }
    autoindex off;
    add_header Cache-Control "private, no-store" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}

# Keep these response headers at the public edge, not only in the Vite server.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self'; connect-src 'self'; frame-ancestors 'none'; form-action 'self'" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;