services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: xianxia
      POSTGRES_USER: xianxia
      POSTGRES_PASSWORD: xianxia
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - xianxia-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xianxia -d xianxia"]
      interval: 5s
      timeout: 3s
      retries: 15
volumes:
  xianxia-postgres:
